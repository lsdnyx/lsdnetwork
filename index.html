<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101722">
  <meta name="description" content="Explore a colourful Diwali town with your friends.">
  <title>Diwali Town | lsdnetwork</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/game.css">
</head>
<body>
  <main class="game-screen">
    <canvas id="world" width="960" height="600" aria-label="Diwali Town game world"></canvas>
    <div class="world-vignette"></div>
    <div class="world-top-hud">
      <div class="hud-left">
        <div class="location-pill"><span class="location-dot"></span><span id="location-name">THE OLD MARKET</span></div>
        <div class="wallet-pill">◉ <strong id="coin-count">100</strong></div>
      </div>
      <div class="hud-right">
        <div class="time-pill">✦ DIWALI NIGHT <span id="clock">8:00 PM</span></div>
        <button class="hud-button" id="settings-button" aria-label="Settings" title="Settings">⚙</button>
      </div>
    </div>
    <div class="room-status" id="connection-label">SOLO WORLD</div>
    <div class="toast" id="toast" aria-live="polite"></div>
    <div class="interaction-hint" id="interaction-hint">Press E to interact</div>
    <div class="mobile-controls" id="mobile-controls">
      <div class="joystick-zone" id="joystick-zone" aria-label="Movement joystick">
        <div class="joystick-base"><div class="joystick-knob" id="joystick-knob"></div></div>
      </div>
      <div class="mobile-action-stack">
        <button class="mobile-action secondary" id="mobile-bag" aria-label="Open bag">▣</button>
        <button class="mobile-action primary" id="mobile-interact" aria-label="Interact">E</button>
      </div>
    </div>
    <div class="desktop-help"><kbd>WASD</kbd> MOVE <kbd>E</kbd> INTERACT <kbd>I</kbd> BAG</div>
    <div class="loading-cover" id="loading-cover"><div class="loading-lamp">✦</div><strong>WAKING UP THE TOWN</strong><span>Setting out the diyas…</span></div>
  </main>

  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" id="modal-close" aria-label="Close">×</button>
      <div class="modal-kicker" id="modal-kicker">DIWALI TOWN</div>
      <h2 id="modal-title">Welcome!</h2>
      <div class="modal-content" id="modal-content"></div>
      <div class="modal-actions" id="modal-actions"></div>
    </section>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
